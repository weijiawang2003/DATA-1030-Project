[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data1030-brown-weather"
version = "0.3.0"
description = "A basic Brown weather pipeline with recent and historical seasonal features"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scikit-learn>=1.5", "matplotlib>=3.9", "requests>=2.32"]

[project.optional-dependencies]
notebook = ["jupyterlab", "ipykernel"]

[project.scripts]
brown-weather = "weather_project.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["weather_project*"]
